<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <script src="./models/drawable-object.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/status-bar.js"></script>
    <script src="./models/status-bar-coin.js"></script>
    <script src="./models/status-bar-salsa.js"></script>
    <script src="./models/status-bar-boss.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/salsa-bottle.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
</head>
<body>
    <h1>El Pollo Loco</h1>
    <div id="game-wrapper">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="start-screen">
            <img id="start-screen-img" src="img/9_intro_outro_screens/start/startscreen_2.png" alt="start-screen">
        </div>
        <div id="game-over-screen" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%;">
            <img src="img/9_intro_outro_screens/game_over/game over.png" alt="game over" style="width:100%; height:100%;">
        </div>
        <div id="you-won-screen" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%;">
            <img src="img/You won, you lost/You won A.png" alt="you won" style="width:100%; height:100%;">
        </div>
    </div>

    <div class="Menu_Buttons">
        <div class="Start_Game">
            <span class="Start_Game_Headline">Start Game</span>
            <button onclick="startGame()"><img class="saloon_door" src="./img/saloon_door-removebg-preview.png" alt=""></button>
        </div>
        <div class="Start_Game">
            <span class="Start_Game_Headline">Help</span>
            <button><img class="openclipart" src="./img/openclipart.svg" alt=""></button>
        </div>
    </div>
</body>
</html>
