<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
    <script src="./models/drawable-object.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/status-bar.js"></script>
    <script src="./models/status-bar-coin.js"></script>
    <script src="./models/status-bar-salsa.js"></script>
    <script src="./models/status-bar-boss.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/salsa-bottle.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
</head>

<body>
    <h1>El Pollo Loco</h1>
    <div id="game-wrapper">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="start-screen">
            <img id="start-screen-img" src="img/9_intro_outro_screens/start/startscreen_2.png" alt="start-screen" />
        </div>
        <div id="game-over-screen" style="
                    display: none;
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                ">
            <img src="img/9_intro_outro_screens/game_over/game over.png" alt="game over"
                style="width: 100%; height: 100%" />
            <div class="end-screen-buttons">
                <button class="end-btn" onclick="restartGame()">
                    Restart Game
                </button>
                <button class="end-btn" onclick="goToHomeMenu()">
                    Home Menu
                </button>
            </div>
        </div>
        <div id="you-won-screen" style="
                    display: none;
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                ">
            <img src="img/You won, you lost/You won A.png" alt="you won" style="width: 100%; height: 100%" />
            <div class="end-screen-buttons">
                <button class="end-btn" onclick="restartGame()">
                    Restart Game
                </button>
                <button class="end-btn" onclick="goToHomeMenu()">
                    Home Menu
                </button>
            </div>
        </div>
        <div id="settings-screen">
            <h2 class="headline_settings">Settings</h2>
            <div class="mute_section">
                <span>Music</span>
                <button id="muteButton" class="Menu-bar-btn" onclick="unmuteBackgroundMusic()">
                    ON
                </button>
                <button class="Menu-bar-btn" onclick="muteBackgroundMusic()">
                    OFF
                </button>
            </div>
            <div class="mute_section">
                <span>Sounds</span>
                <button class="Menu-bar-btn" onclick="muteSounds()">
                    ON
                </button>
                <button class="Menu-bar-btn" onclick="muteSounds()">
                    OFF
                </button>
            </div>

            <div class="mute_section">
                <span>Fullscreen</span>
                <button class="Menu-bar-btn" onclick="muteBackgroundMusic()">
                    ON
                </button>
                 <button class="Menu-bar-btn" onclick="muteBackgroundMusic()">
                    OFF
                </button>
            </div>

            <button class="settings-btn" onclick="closeSettings()">
                Schließen
            </button>
        </div>
        <div id="help-screen">
            <h2 class="headline_settings">Help</h2>
            <button class="settings-btn" onclick="closeHelp()">
                Schließen
            </button>
        </div>
    </div>

    <div class="Menu-bar">
        <div class="Menu_Buttons">
            <div class="Start_Game">
                <button class="Menu-bar-btn" onclick="openSettings()">
                    Settings
                </button>
            </div>
        </div>
        <div class="Menu_Buttons">
            <div class="Start_Game">
                <button class="Menu-bar-btn" onclick="startGame()">
                    Start Game
                </button>
            </div>
        </div>
        <div class="Menu_Buttons">
            <div class="Start_Game">
                <button class="Menu-bar-btn" onclick="openHelp()">
                    Help
                </button>
            </div>
        </div>
    </div>
</body>

</html>
